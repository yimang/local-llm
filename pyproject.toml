[project]
name = "local-llm"
version = "0.1.0"
description = "Reproducible local LLM benchmarks for Apple silicon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.0.1",
    "mlx-lm>=0.31.3",
    "numpy>=2.5.2",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.2",
    "torch>=2.14.0",
    "transformers>=5.16.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
extra-paths = ["card-oracle/query-segmentation/src"]
python-version = "3.12"
python-platform = "darwin"
