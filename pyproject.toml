[project]
name = "local-llm"
version = "0.1.0"
description = "Reproducible local LLM benchmarks for Apple silicon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-lm>=0.31.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"
python-platform = "darwin"
